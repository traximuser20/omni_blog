<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" role="img" aria-label="OmniBlog">
  <defs>
    <linearGradient id="omni-tile-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="omni-accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <!-- Mark: rounded tile with O -->
  <rect x="0" y="0" width="96" height="96" rx="22" ry="22" fill="url(#omni-tile-grad)"/>
  <rect x="0" y="76" width="96" height="20" rx="0" ry="0" fill="url(#omni-accent-grad)" opacity="0.9"/>
  <clipPath id="tile-clip"><rect x="0" y="0" width="96" height="96" rx="22" ry="22"/></clipPath>
  <g clip-path="url(#tile-clip)">
    <rect x="0" y="76" width="96" height="20" fill="url(#omni-accent-grad)" opacity="0.9"/>
  </g>
  <text x="48" y="50" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="64" fill="#fafaf9">O</text>
  <!-- Wordmark -->
  <text x="116" y="62" font-family="Georgia, 'Times New Roman', serif" font-weight="600"
        font-size="52" fill="#1c1917" letter-spacing="-1">OmniBlog</text>
  <!-- Accent dot -->
  <circle cx="406" cy="60" r="5" fill="#ea580c"/>
</svg>
