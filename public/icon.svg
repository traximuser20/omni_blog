<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OmniBlog">
  <defs>
    <linearGradient id="omni-accent" x1="0" y1="1" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <clipPath id="omni-tile">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>
  <g clip-path="url(#omni-tile)">
    <rect width="512" height="512" fill="#1c1917"/>
    <rect x="0" y="400" width="512" height="112" fill="url(#omni-accent)" opacity="0.9"/>
    <text x="256" y="270" text-anchor="middle" dominant-baseline="central"
          font-family="Georgia, 'Times New Roman', serif" font-weight="700"
          font-size="320" fill="#fafaf9" letter-spacing="-8">O</text>
  </g>
</svg>
